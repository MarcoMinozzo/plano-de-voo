{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block corpo %}
<h1>Entrar</h1>
{% if mensagem %}<p class="erro">{{ mensagem }}</p>{% endif %}
<form method="post">
    <label>Identificação <input name="identificacao" required></label>
    <label>Senha <input name="senha" type="password" required></label>
    <button type="submit">Entrar</button>
</form>
<p><a href="{{ url_for('cadastro') }}">Criar acesso</a></p>
{% endblock %}
