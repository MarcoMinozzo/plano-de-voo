<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Plano de voo{% endblock %}</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            color: #001030;
            line-height: 1.45;
            min-height: 100vh;
            background: #001030 url("{{ url_for('static', filename='casca/blueprint-airport-runway.jpg') }}") center / cover fixed;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 16, 48, 0.35);
            pointer-events: none;
        }
        header, main { position: relative; }
        header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 12px;
            background: #001030;
            color: #F4F7FB;
        }
        header img { width: 72px; height: auto; }
        .menu-voo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .menu-voo a, .menu-voo button {
            min-height: 44px;
            padding: 12px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            color: #F4F7FB;
            font: inherit;
            text-decoration: none;
        }
        .menu-voo form { display: inline; margin: 0; }
        main { padding: 12px; }
        .vidro {
            width: min(100% - 24px, 40rem);
            margin: 16px auto;
            padding: 24px;
            border-radius: 24px;
            background: rgba(28, 51, 72, 0.82);
            color: #F4F7FB;
        }
        .vidro input, .vidro select {
            background: #F4F7FB;
            color: #001030;
            border: 0;
            border-radius: 8px;
            padding: 12px;
            font: inherit;
        }
        .vidro button, .leitura button {
            min-height: 44px;
            border: 0;
            border-radius: 16px;
            background: #F0A000;
            color: #001030;
            font: inherit;
        }
        .ampulheta { text-align: center; color: #F4F7FB; padding: 48px 12px; }
        .ampulheta::before {
            content: "";
            display: block;
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border: 4px solid rgba(240, 160, 0, 0.35);
            border-top-color: #F0A000;
            border-radius: 9999px;
        }
        .leitura {
            width: min(100% - 24px, 48rem);
            margin: 16px auto;
            padding: 24px;
            border-radius: 24px;
            background: rgba(244, 247, 251, 0.94);
            color: #001030;
        }
        a { color: #0090F0; }
        .leitura a { color: #001030; }
        form { display: grid; gap: 0.6rem; }
        label { display: grid; gap: 0.2rem; }
        .aviso { margin-top: 16px; }
        .erro { color: #F0A000; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border-bottom: 1px solid #8AA0B8; padding: 0.3rem 0.6rem; text-align: left; }
        caption { caption-side: bottom; text-align: left; padding-top: 0.4rem; }
        #mapa { height: 320px; margin-top: 0.4rem; }
        .abas { display: flex; gap: 8px; overflow-x: auto; }
        @media (max-width: 719px) {
            body { overflow-x: hidden; }
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='casca/emblema-plano-de-voo.png') }}" alt="Plano de voo">
        {% if session.get('piloto_id') %}
        <nav class="menu-voo">
            <a href="{{ url_for('novo_plano') }}">Novo voo</a>
            <a href="{{ url_for('painel') }}">Voos planejados</a>
            {% block menu_imprimir %}
            <a href="#sem-voo">Imprimir voo</a>
            {% endblock %}
            <form method="post" action="{{ url_for('sair') }}">
                <button type="submit">Sair</button>
            </form>
        </nav>
        {% block aviso_impressao %}
        <p id="sem-voo">Não há voo para imprimir.</p>
        {% endblock %}
        {% endif %}
    </header>
    <main>
        {% block corpo %}{% endblock %}
    </main>
</body>
</html>
