<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Plano de voo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="m-0 min-h-screen bg-aviation-navy bg-center bg-cover bg-fixed font-sans leading-[1.45] text-aviation-navy before:pointer-events-none before:fixed before:inset-0 before:bg-aviation-overlay before:content-[''] max-md:overflow-x-hidden"
      style="background-image: url('{{ url_for('static', filename='casca/blueprint-airport-runway.jpg') }}')">
    <header class="relative flex flex-wrap items-center gap-2 bg-aviation-navy p-3 text-aviation-white">
        {% block logo_cabecalho %}
        <img class="h-auto w-[72px]" src="{{ url_for('static', filename='casca/emblema-plano-de-voo.png') }}" alt="Plano de voo">
        {% endblock %}
        {% if session.get('piloto_id') %}
        <nav class="menu-voo flex flex-wrap items-center gap-2">
            <a class="inline-flex min-h-11 items-center rounded-2xl border-0 bg-transparent p-3 font-[inherit] text-aviation-white no-underline" href="{{ url_for('novo_plano') }}">Novo voo</a>
            <a class="inline-flex min-h-11 items-center rounded-2xl border-0 bg-transparent p-3 font-[inherit] text-aviation-white no-underline" href="{{ url_for('painel') }}">Voos planejados</a>
            <a class="inline-flex min-h-11 items-center rounded-2xl border-0 bg-transparent p-3 font-[inherit] text-aviation-white no-underline" href="{{ url_for('perfil') }}">Perfil</a>
            {% block menu_imprimir %}
            <a class="inline-flex min-h-11 items-center rounded-2xl border-0 bg-transparent p-3 font-[inherit] text-aviation-white no-underline" href="#sem-voo">Imprimir voo</a>
            {% endblock %}
            <form class="m-0 inline" method="post" action="{{ url_for('sair') }}">
                <button class="inline-flex min-h-11 cursor-pointer items-center rounded-2xl border-0 bg-transparent p-3 font-[inherit] text-aviation-white" type="submit">Sair</button>
            </form>
        </nav>
        {% block aviso_impressao %}
        <p class="text-aviation-white" id="sem-voo">Não há voo para imprimir.</p>
        {% endblock %}
        {% endif %}
    </header>
    <main class="relative p-3">
        {% block corpo %}{% endblock %}
    </main>
</body>
</html>
