{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block corpo %}
<h1>Criar acesso</h1>
{% if mensagem %}<p class="erro">{{ mensagem }}</p>{% endif %}
<form method="post">
    <label>Identificação <input name="identificacao" required></label>
    <label>Senha (mínimo 8 caracteres) <input name="senha" type="password" minlength="8" required></label>
    <button type="submit">Cadastrar</button>
</form>
{% endblock %}
