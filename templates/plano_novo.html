{% extends "base.html" %}
{% block titulo %}Novo plano{% endblock %}
{% block corpo %}
<h1>Novo plano</h1>
{% if mensagem %}<p class="erro">{{ mensagem }}</p>{% endif %}
<form method="post" action="{{ url_for('planos') }}">
    <label>Aeronave
        <select name="aeronave_id">
            {% for aeronave in aeronaves %}
            <option value="{{ aeronave.id }}">{{ aeronave.nome }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Origem <input name="origem" required maxlength="4"></label>
    <label>Destino <input name="destino" required maxlength="4"></label>
    <label>Hora de partida <input name="hora_partida" type="datetime-local" required></label>
    <label>Ocupantes <input name="ocupantes" type="number" min="1" required></label>
    <label>Peso do piloto (kg) <input name="peso_piloto_kg" type="number" step="0.1" required></label>
    <label>Peso do passageiro (kg) <input name="peso_passageiro_kg" type="number" step="0.1" value="0" required></label>
    <label>Bagagem (kg) <input name="peso_bagagem_kg" type="number" step="0.1" value="0" required></label>
    <label>Combustível a bordo (gal) <input name="combustivel_a_bordo_gal" type="number" step="0.1" required></label>
    <label><input name="confirmar_hora" type="checkbox" value="true"> A hora já passou e eu quero planejar mesmo assim</label>
    <button type="submit">Calcular</button>
</form>
<article class="aviso">{{ orientacao }}</article>
{% endblock %}
