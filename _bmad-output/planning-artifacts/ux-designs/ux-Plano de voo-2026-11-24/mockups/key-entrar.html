<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar — Plano de voo</title>
<style>
  /* DESIGN.md: page-background, emblem, glass-card, text-field, primary-button, disclaimer.
     EXPERIENCE.md: Entrar em repouso. Fluxo 1, passo 1. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: sans-serif; color: #F4F7FB; }
  .viewport { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; background: #001030 url("../imports/blueprint-airport-runway.jpg") center/cover no-repeat; }
  .viewport::before { content: ""; position: fixed; inset: 0; background: rgba(0, 16, 48, 0.35); }
  .card { position: relative; width: min(100%, 24rem); padding: 24px; border-radius: 24px; background: rgba(28, 51, 72, 0.82); }
  img { display: block; width: 168px; height: auto; margin: 0 auto 16px; }
  h1 { margin: 0 0 16px; font-size: 1.75rem; line-height: 1.25; text-align: center; }
  label { display: block; margin-bottom: 12px; font-size: 0.875rem; }
  input { display: block; width: 100%; margin-top: 4px; padding: 12px; border: 0; border-radius: 8px; background: #F4F7FB; color: #001030; font: 1rem/1.45 sans-serif; }
  button { width: 100%; margin-top: 8px; padding: 12px 16px; border: 0; border-radius: 16px; background: #F0A000; color: #001030; font: 700 1rem/1.45 sans-serif; }
  p { margin: 16px 0 0; font-size: 0.875rem; line-height: 1.4; }
  a { color: #F4F7FB; }
</style>
</head>
<body>
  <main class="viewport">
    <section class="card">
      <img src="../imports/emblema-plano-de-voo.png" alt="Plano de voo">
      <h1>Entrar</h1>
      <form>
        <label>Identificação <input name="identificacao" autocomplete="username"></label>
        <label>Senha <input name="senha" type="password" autocomplete="current-password"></label>
        <button type="button">Entrar</button>
      </form>
      <p>O resultado apoia o planejamento e não autoriza o voo.</p>
      <p><a href="#">Criar acesso</a></p>
    </section>
  </main>
</body>
</html>
