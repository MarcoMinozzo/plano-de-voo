<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Em processamento — Plano de voo</title>
<style>
  /* DESIGN.md: page-background, menu-bar, processing.
     EXPERIENCE.md: estado Espera. Fluxo 1, passo 3. O card de entrada não aparece. */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: sans-serif; color: #F4F7FB; background: #001030; }
  .viewport { min-height: 100vh; background: #001030 url("../imports/blueprint-airport-runway.jpg") center/cover no-repeat; }
  .viewport::before { content: ""; position: fixed; inset: 0; background: rgba(0, 16, 48, 0.35); }
  header, main { position: relative; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; background: #001030; }
  header img { width: 72px; height: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  nav span { min-height: 44px; padding: 12px; border-radius: 16px; }
  nav .atual { box-shadow: inset 0 -2px 0 #F0A000; }
  main { min-height: calc(100vh - 88px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .ampulheta { width: 48px; height: 48px; border: 4px solid rgba(240, 160, 0, 0.35); border-top-color: #F0A000; border-radius: 9999px; }
  p { margin: 0; font-size: 1rem; line-height: 1.45; }
</style>
</head>
<body>
  <div class="viewport">
    <header>
      <img src="../imports/emblema-plano-de-voo.png" alt="Plano de voo">
      <nav>
        <span class="atual">Novo voo</span>
        <span>Voos planejados</span>
        <span>Imprimir voo</span>
        <span>Sair</span>
      </nav>
    </header>
    <main>
      <div class="ampulheta" role="img" aria-label="Em processamento"></div>
      <p>Em processamento</p>
    </main>
  </div>
</body>
</html>
